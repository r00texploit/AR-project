name: Build WebGL (Optional)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webgl-artifact
  cancel-in-progress: true

jobs:
  build-webgl:
    name: Build WebGL
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Cache Library ─────────────────────────────────────────────────────
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      # ── 3. Build WebGL ────────────────────────────────────────────────────────
      # Note: AR Foundation scenes are excluded — only Quiz + Progress & Reports
      # work in WebGL (no camera/ARCore available in browsers).
      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform:  WebGL
          unityVersion:    6000.4.8f1
          buildName:       AR-Education-WebGL
          buildsPath:      builds
          # Only include non-AR scenes for the WebGL build
          customParameters: >
            -scenes Assets/Scenes/MainMenu.unity,Assets/Scenes/Quiz.unity,Assets/Scenes/TeacherDashboard.unity

      # ── 4. Upload WebGL artifact ─────────────────────────────────────────────
      - name: Upload WebGL artifact
        uses: actions/upload-artifact@v4
        with:
          name: AR-Education-WebGL-${{ github.run_number }}
          path: builds/WebGL
          retention-days: 14
